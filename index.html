<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Locations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --terminal-bg: #050a0f;
      --terminal-primary: #00f3ff;
      --terminal-dim: #005f63;
      --terminal-alert: #ff2a2a;
    }

    body {
      background-color: var(--terminal-bg);
      color: var(--terminal-primary);
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      overflow: hidden;
    }

    /* CRT Scanline Effect */
    .scanlines {
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.6;
    }

    .flicker {
      animation: flicker 0.15s infinite;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 255, 255, 0.02);
      pointer-events: none;
      z-index: 51;
    }

    @keyframes flicker {
      0% {
        opacity: 0.9;
      }

      50% {
        opacity: 1.0;
      }

      100% {
        opacity: 0.9;
      }
    }

    /* Text Glow */
    .glow-text {
      text-shadow: 0 0 5px var(--terminal-primary), 0 0 10px var(--terminal-primary);
    }

    /* Grid Background */
    .bg-grid {
      background-image:
        linear-gradient(var(--terminal-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--terminal-dim) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      opacity: 0.15;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #001115;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--terminal-dim);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--terminal-primary);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <div class="scanlines"></div>
  <div class="flicker"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
